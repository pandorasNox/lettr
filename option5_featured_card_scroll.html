<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lettr — Option 5: Featured Card + Scroll</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    .dot { transition: background-color 0.3s, transform 0.3s; }
    .dot.active { transform: scale(1.3); }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen flex flex-col">

  <!-- Nav -->
  <nav class="flex justify-between items-center px-4 py-3">
    <div class="w-32"><h1 class="pl-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">lettr</h1></div>
    <div class="w-64 flex justify-center">
      <div class="group relative">
        <button type="button" class="inline-flex items-center font-medium justify-center px-4 py-2 text-sm text-gray-900 dark:text-white rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700">
          <svg class="h-3.5 w-3.5 rounded-full me-2" viewBox="0 0 512 512"><path fill="#ffce00" d="M0 341.3h512V512H0z"/><path d="M0 0h512v170.7H0z"/><path fill="#d00" d="M0 170.7h512v170.6H0z"/></svg>
          <span>Deutsch</span>
          <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/></svg>
        </button>
        <div class="absolute z-10 w-40 mt-1 origin-top-left bg-white divide-y divide-gray-100 rounded-lg shadow-sm dark:bg-gray-700 dark:divide-gray-600 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition duration-300">
          <ul class="py-2 text-sm text-gray-700 dark:text-gray-200">
            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">English (US)</a></li>
            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Deutsch</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="w-32 flex justify-end">
      <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
        <svg id="dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        <svg id="light-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 py-16">
    <h2 class="mb-12 text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white">lettr</h2>

    <!-- Featured Card -->
    <div class="w-full max-w-lg">
      <div class="relative bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 overflow-hidden">

        <!-- Mode label -->
        <div class="absolute top-5 right-5">
          <span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-green-900 dark:text-green-300">Mode 1 of 3</span>
        </div>

        <div class="p-8 sm:p-12 text-center">
          <!-- Icon -->
          <div class="w-20 h-20 mx-auto mb-6 bg-green-100 dark:bg-green-900 rounded-lg flex items-center justify-center">
            <svg class="w-10 h-10 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>

          <!-- Title -->
          <h3 class="mb-2 text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Classic</h3>
          <p class="mb-6 font-medium text-green-700 dark:text-green-400">The original lettr experience</p>

          <!-- Description -->
          <p class="mb-8 max-w-sm mx-auto font-normal text-gray-700 dark:text-gray-400 leading-relaxed">
            Guess the 5-letter word in 6 tries. Each guess turns green when correct and yellow when misplaced.
          </p>

          <!-- Play Button -->
          <a href="#" class="inline-flex items-center px-5 py-2.5 text-sm font-medium text-center text-white bg-green-700 rounded-lg hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
            Play now
            <svg class="w-3.5 h-3.5 ms-2 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/></svg>
          </a>
        </div>
      </div>

      <!-- Navigation arrows -->
      <div class="flex items-center justify-center gap-6 mt-6">
        <button type="button" class="w-10 h-10 flex items-center justify-center rounded-full text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-100 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button type="button" class="w-10 h-10 flex items-center justify-center rounded-full text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-100 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <!-- Dots -->
      <div class="flex items-center justify-center gap-2 mt-5">
        <span class="dot w-2.5 h-2.5 rounded-full bg-green-600 dark:bg-green-500 active"></span>
        <span class="dot w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600"></span>
        <span class="dot w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600"></span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white rounded-lg shadow-sm dark:bg-gray-900 m-4 mt-8 border-t border-gray-200 dark:border-gray-800">
    <p class="text-center font-semibold text-3xl py-6 text-gray-900 dark:text-white">lettr's making words!</p>
    <div class="w-full max-w-screen-xl mx-auto p-4 md:py-8">
      <div class="flex justify-center items-center">
        <button type="button" class="text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-full text-sm inline-flex items-center px-5 py-2.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700">
          <svg class="w-4 h-4 me-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
          Suggest a word
        </button>
      </div>
      <hr class="my-6 border-gray-200 sm:mx-auto dark:border-gray-700 lg:my-8" />
      <span class="block text-sm text-gray-500 text-center dark:text-gray-400">Made with HTMX</span>
    </div>
  </footer>

  <script>
    const darkIcon = document.getElementById('dark-icon');
    const lightIcon = document.getElementById('light-icon');
    const toggle = document.getElementById('theme-toggle');
    const isDark = document.documentElement.classList.contains('dark');
    if (isDark) { darkIcon.classList.remove('hidden'); lightIcon.classList.add('hidden'); }
    else { darkIcon.classList.add('hidden'); lightIcon.classList.remove('hidden'); }
    toggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      darkIcon.classList.toggle('hidden');
      lightIcon.classList.toggle('hidden');
    });
  </script>
</body>
</html>
